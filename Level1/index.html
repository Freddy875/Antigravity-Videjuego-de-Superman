<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Superman: Nivel 1 — Metrópolis (Edición Web)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0b0f19;
      background-image: radial-gradient(circle at 50% 30%, #152238 0%, #070a12 100%);
      color: #ffffff;
      font-family: 'Press Start 2P', monospace, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16 / 9;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(1, 119, 250, 0.3);
      border: 3px solid #239bfa;
      border-radius: 8px;
      overflow: hidden;
      background-color: #000000;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Barra inferior con controles e información */
    #info-bar {
      margin-top: 10px;
      font-size: 11px;
      color: #82b7e8;
      text-align: center;
      line-height: 1.6;
    }

    #info-bar span {
      color: #f5c518;
    }

    /* Controles táctiles en pantalla para móviles/tablets */
    #touch-controls {
      display: none;
      position: absolute;
      bottom: 15px;
      left: 0;
      right: 0;
      padding: 0 25px;
      justify-content: space-between;
      pointer-events: none;
      z-index: 50;
    }

    .touch-btn-group {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }

    .touch-dpad {
      display: grid;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(3, 50px);
      gap: 5px;
      pointer-events: auto;
    }

    .touch-btn {
      background: rgba(10, 25, 50, 0.65);
      border: 2px solid #5e90bf;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      touch-action: manipulation;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .touch-btn:active {
      background: #c71e17;
      border-color: #f5c518;
    }

    .action-btn {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      font-size: 11px;
      text-align: center;
    }

    .btn-laser {
      background: rgba(165, 14, 13, 0.75);
      border-color: #ff2a2a;
    }

    .btn-punch {
      background: rgba(49, 88, 146, 0.75);
      border-color: #f5c518;
    }

    @media (max-width: 900px) {
      #touch-controls {
        display: flex;
      }
      #info-bar {
        font-size: 9px;
      }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="1280" height="720"></canvas>

    <!-- Controles táctiles virtuales -->
    <div id="touch-controls">
      <!-- D-Pad -->
      <div class="touch-dpad">
        <div></div>
        <div class="touch-btn" id="btn-up">▲</div>
        <div></div>
        <div class="touch-btn" id="btn-left">◀</div>
        <div></div>
        <div class="touch-btn" id="btn-right">▶</div>
        <div></div>
        <div class="touch-btn" id="btn-down">▼</div>
        <div></div>
      </div>

      <!-- Botones de Acción -->
      <div class="touch-btn-group">
        <button class="touch-btn action-btn btn-punch" id="btn-punch">GOLPE<br>(X)</button>
        <button class="touch-btn action-btn btn-laser" id="btn-laser">LÁSER<br>(ESP)</button>
      </div>
    </div>
  </div>

  <div id="info-bar">
    <span>FLECHAS / WASD</span>: Volar &nbsp;|&nbsp; 
    <span>ESPACIO</span>: Rayos Láser &nbsp;|&nbsp; 
    <span>X</span>: Golpe Físico &nbsp;|&nbsp; 
    <span>☀️ SOL</span>: Recarga Solar &nbsp;|&nbsp; 
    <span>P / ESC</span>: Pausa
  </div>

  <script src="game.js"></script>
</body>
</html>
